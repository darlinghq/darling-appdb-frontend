<button mat-button type="button" class="star-button" [attr.aria-pressed]="voted()"
        [attr.aria-label]="voted() ? 'Remove your vote' : 'Vote for this software'"
        [disabled]="busy()" (click)="toggle()">
  <mat-icon>{{ voted() ? 'star' : 'star_border' }}</mat-icon>
  <span class="star-count">{{ count() }}</span>
</button>
@if (error()) {
  <span class="star-error" role="alert">{{ error() }}</span>
}
