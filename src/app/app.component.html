<mat-toolbar color="primary">
  <a routerLink="/" class="brand">
    <img src="assets/img/darling250.png" alt="Darling logo" class="logo-img" />
    <span class="title">Darling AppDB</span>
  </a>
  <a mat-flat-button routerLink="/submit/software" class="add-software-btn">+ Add software</a>
  <span class="spacer"></span>
  <div class="header-search">
    <input #headerSearch type="search" placeholder="Search software…" (keyup.enter)="search(headerSearch.value)" />
  </div>
  <a mat-button href="http://docs.darlinghq.org">Docs</a>
  <a mat-button href="http://blog.darlinghq.org/">Blog</a>
  <a mat-button href="https://github.com/darlinghq/darling">GitHub</a>
  <a mat-button href="https://discord.gg/XRD3mQA">Discord</a>
  @if (auth.user()) {
    <span class="user-info" title="Logged in via {{ auth.user()!.provider }}">
      <mat-icon>account_circle</mat-icon>
      <span class="user-name">{{ displayName() }}</span>
    </span>
    <button mat-button type="button" (click)="logout()">Log out</button>
  } @else {
    <a mat-stroked-button class="login-btn" routerLink="/login" [queryParams]="loginQueryParams()">Sign in</a>
  }
</mat-toolbar>
<div class="container">
  <router-outlet></router-outlet>
</div>
<footer role="contentinfo">
  <p>&copy; 2012&ndash;2026 Darling developers</p>
</footer>
